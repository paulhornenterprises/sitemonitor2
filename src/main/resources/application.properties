spring.application.name=sitemonitor2

server.port=${port\:8012}
server.servlet.context-path=/sm2

# File-based H2 database
spring.datasource.url=jdbc:h2:file:./data/sitemonitor
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Automatically run schema.sql/data.sql
spring.sql.init.mode=always

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Run every 60 seconds
site-monitor.interval-ms=60000

# Wait briefly after application startup
site-monitor.initial-delay-ms=5000

# Maximum HTTP requests executing concurrently
site-monitor.concurrent-checks=32

# Maximum pending checks
site-monitor.queue-capacity=500

# HTTP connection and response timeouts
site-monitor.connect-timeout-seconds=5
site-monitor.read-timeout-seconds=15

#spring.mail.host=smtp.somehost.com
#spring.mail.from=someone@test.net

spring.output.ansi.enabled=ALWAYS

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate=INFO
logging.level.sitemonitor2=DEBUG
