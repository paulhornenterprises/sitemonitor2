<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
  <head th:replace="~{fragments/head :: commonHead('Monitor Dashboard', ~{::pageCss})}">
  <th:block th:fragment="pageCss">
    <style>
		.dashboard-banner {
			background: linear-gradient(
				90deg,
				#0d6efd,
				#6610f2
			);
			color: white;
			border-radius: 12px;
			padding: 20px;
		}
		.sortable {
		    cursor: pointer;
		    user-select: none;
		}

		.sortable:hover {
		    color: var(--bs-primary);
		}

		.sortable.asc::after {
		    content: " ▲";
		}

		.sortable.desc::after {
		    content: " ▼";
		}

    </style>
  </th:block>  
  </head>
  <body>
    <nav th:replace="~{fragments/head :: commonNav}"></nav>
    
    <div class="container mt-4">
      <div class="dashboard-banner">
        Site Monitor Dashboard
      </div>
    </div>    
    
    <div class="container mt-4">
      <div class="card dashboard-card">
        <div class="card-header bg-white">
          <div class="d-flex justify-content-between align-items-center">
            <h3 class="page-header mb-0"><i class="bi bi-globe"></i> Site Configuration</h3>

            <a class="btn btn-success" th:href="@{/sites/new}"> + Add Site </a>
          </div>
        </div>

        <div class="card-body">
			
          <div class="row mb-3">
          	<div class="col-md-4">
          		<input id="siteSearch" class="form-control" type="text" placeholder="Search sites...">
          	</div>
          </div>
			
          <table 
		  		id="siteTable" 
				class="table table-hover align-middle">
            <thead>
              <tr>
                <th class="sortable" data-column="0">ID</thclass="sortable">
                <th class="sortable" data-column="1">Name</th>
                <th class="sortable" data-column="2">Status</th>
                <th class="sortable" data-column="3">Enabled</th>
                <th class="sortable" data-column="4">Msec.</th>
                <th class="sortable" data-column="5">Failures</th>
                <th class="sortable" data-column="6">Assert</th>
				<th class="sortable" data-column="7">Checked</th>
                <th class="sortable" data-column="8">Notify</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="site : ${sites}">
                <td th:text="${site.id}"></td>
                <td class="text-nowrap">
					<a class="btn btn-primary" style="--bs-btn-font-size: .55rem;" 
					   th:href="${site.url}" role="button" target="_blank"><i class="bi bi-box-arrow-up-right"></i></a>
					[[${site.name}]]
				</td>
                <td>
                  <span th:if="${site.status == 'OK'}" class="badge bg-success"> [[${site.status}]] </span>

                  <span th:if="${site.status != 'OK'}" class="badge bg-danger"> [[${site.status}]] </span>
                </td>
                <td>
                  <span th:if="${site.enabled}" class="badge bg-primary"> Enabled </span>

                  <span th:unless="${site.enabled}" class="badge bg-secondary"> Disabled </span>
                </td>
                <td th:text="${site.responseTime}"></td>
                <td>
					[[${site.failures}]] / [[${site.failureLimit}]]
				</td>
                <td th:text="${site.assertText}"></td>
				<td th:data-order="${site.eventTime}">
				    <span class="badge bg-secondary"
				          data-bs-toggle="tooltip"
				          th:data-bs-title="${site.eventDescription}">
				        [[${site.eventTimeDisplay}]]
				    </span>
				</td>				
                <td>
					<span class="badge bg-success"
					      data-bs-toggle="tooltip"
						  data-bs-custom-class="notify-tooltip" 
						  th:data-bs-title="${site.notify}"
						  ><i class="bi bi-envelope-at"></i></span>
				</td>
                <td>
                  <div class="d-flex gap-2">
                    <a th:href="@{/sites/{id}(id=${site.id})}" class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-pencil"></i> Edit
                    </a>

                    <form th:action="@{/sites/{id}/delete(id=${site.id})}" method="post">
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                        onclick="return confirm('Delete this site?');"
                      >
                        <i class="bi bi-trash"></i> Delete
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
		const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))	
	</script>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
		  const table = document.getElementById("siteTable");
		  const tbody = table.querySelector("tbody");
		  const search = document.getElementById("siteSearch");

		  search.addEventListener("input", function () {
		    const term = this.value.toLowerCase();
		    tbody.querySelectorAll("tr").forEach((row) => {
		      const text = row.innerText.toLowerCase();
		      row.style.display = text.includes(term) ? "" : "none";
		    });
		  });

		  document.querySelectorAll(".sortable").forEach((header) => {
		    header.addEventListener("click", () => {
		      const column = parseInt(header.dataset.column);
		      const ascending = !header.classList.contains("asc");
		      sortTable(column, ascending);
		      document.querySelectorAll(".sortable").forEach((th) => {
		        th.classList.remove("asc", "desc");
		      });
		      header.classList.add(ascending ? "asc" : "desc");
		    });
		  });

		  function sortTable(column, ascending) {
		    const rows = Array.from(tbody.querySelectorAll("tr"));
		    rows.sort((a, b) => {
			  const aText = a.cells[column].dataset.order || a.cells[column].innerText.trim();
			  const bText = b.cells[column].dataset.order || b.cells[column].innerText.trim();			  
		      const aNum = Number(aText);
		      const bNum = Number(bText);
		      if (!isNaN(aNum) && !isNaN(bNum)) {
		        return ascending ? aNum - bNum : bNum - aNum;
		      }
		      return ascending ? aText.localeCompare(bText) : bText.localeCompare(aText);
		    });
		    rows.forEach((row) => tbody.appendChild(row));
		  }
		});
	</script>	
	
  </body>
</html>
