<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: commonHead('Monitor Dashboard', ~{::pageCss})}">
  <th:block th:fragment="pageCss">
    <style>
		.dashboard-banner {
			background: linear-gradient(
				90deg,
				#0d6efd,
				#6610f2
			);
			color: white;
			border-radius: 12px;
			padding: 20px;
		}        
    </style>
  </th:block>  
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/sites"> Site Monitor</a>
      </div>
    </nav>
    
    <div class="container mt-4">
      <div class="dashboard-banner">
        Site Monitor Dashboard
      </div>
    </div>    
    
    <div class="container mt-4">
      <div class="card dashboard-card">
        <div class="card-header bg-white">
          <div class="d-flex justify-content-between align-items-center">
            <h3 class="page-header mb-0"><i class="bi bi-globe"></i> Site Configuration</h3>

            <a class="btn btn-success" th:href="@{/sites/new}"> + Add Site </a>
          </div>
        </div>

        <div class="card-body">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>URL</th>
                <th>Status</th>
                <th>Enabled</th>
                <th>Msec.</th>
                <th>Failures</th>
                <th>Assert</th>
                <th>Notify</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="site : ${sites}">
                <td th:text="${site.id}"></td>
                <td th:text="${site.name}"></td>
                <td th:text="${site.url}"></td>
                <td>
                  <span th:if="${site.status == 'OK'}" class="badge bg-success"> [[${site.status}]] </span>

                  <span th:if="${site.status != 'OK'}" class="badge bg-danger"> [[${site.status}]] </span>
                </td>
                <td>
                  <span th:if="${site.enabled}" class="badge bg-primary"> Enabled </span>

                  <span th:unless="${site.enabled}" class="badge bg-secondary"> Disabled </span>
                </td>
                <td th:text="${site.responseTime}"></td>
                <td th:text="${site.failures}"></td>
                <td th:text="${site.assertText}"></td>
                <td th:text="${site.notify}"></td>
                <td>
                  <div class="d-flex gap-2">
                    <a th:href="@{/sites/{id}(id=${site.id})}" class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-pencil"></i> Edit
                    </a>

                    <form th:action="@{/sites/{id}/delete(id=${site.id})}" method="post">
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                        onclick="return confirm('Delete this site?');"
                      >
                        <i class="bi bi-trash"></i> Delete
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
