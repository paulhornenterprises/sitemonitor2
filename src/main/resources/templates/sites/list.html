<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Site Monitor - Sites</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">
<style>
body {
    background-color: #f4f6f9;
}

.navbar-brand {
    font-weight: 600;
}

.dashboard-card {
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    border: none;
    border-radius: 12px;
}

.table-card {
    border-radius: 12px;
    overflow: hidden;
}

.page-header {
    color: #0d6efd;
    font-weight: 600;
}

.status-active {
    background-color: #198754;
}

.status-inactive {
    background-color: #dc3545;
}

.badge {
    font-size: .85rem;
}
</style>        
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/sites">
            Site Monitor
        </a>
    </div>
</nav>
<div class="container mt-4">

    <div class="card dashboard-card">
        <div class="card-header bg-white">
            <div class="d-flex justify-content-between align-items-center">

                <h3 class="page-header mb-0">
                    <i class="bi bi-globe"></i> Site Configuration
                </h3>

                <a class="btn btn-success"
                   th:href="@{/sites/new}">
                    + Add Site
                </a>

            </div>
        </div>

        <div class="card-body">

            <table class="table table-hover align-middle">
		    <thead>
		    <tr>
		        <th>ID</th>
		        <th>Name</th>
		        <th>URL</th>
		        <th>Status</th>
		        <th>Enabled</th>
		        <th>Msec.</th>
		        <th>Failures</th>
		        <th>Assert</th>
		        <th>Notify</th>
		        <th>Actions</th>
		    </tr>
		    </thead>
		
		    <tbody>
		    <tr th:each="site : ${sites}">
		        <td th:text="${site.id}"></td>
		        <td th:text="${site.name}"></td>
		        <td th:text="${site.url}"></td>
				<td>
				    <span th:if="${site.status == 'A'}"
				          class="badge bg-success">
				        Active
				    </span>
				
				    <span th:if="${site.status == 'I'}"
				          class="badge bg-danger">
				        Inactive
				    </span>
				</td>
				<td>
				
				    <span th:if="${site.enabled}"
				          class="badge bg-primary">
				        Enabled
				    </span>
				
				    <span th:unless="${site.enabled}"
				          class="badge bg-secondary">
				        Disabled
				    </span>
				
				</td>
				<td th:text="${site.responseTime}"></td>
				<td th:text="${site.failures}"></td>
				<td th:text="${site.assertText}"></td>
				<td th:text="${site.notify}"></td>
				<td>
				    <div class="d-flex gap-2">
				
				        <a th:href="@{/sites/{id}(id=${site.id})}"
				           class="btn btn-sm btn-outline-primary">
				            <i class="bi bi-pencil"></i> Edit
				        </a>
				
				        <form th:action="@{/sites/{id}/delete(id=${site.id})}"
				              method="post">
				
				            <button type="submit"
				                    class="btn btn-sm btn-outline-danger"
				                    onclick="return confirm('Delete this site?');">
				                <i class="bi bi-trash"></i> Delete
				            </button>
				
				        </form>
				
				    </div>
				</td>
		    </tr>
		    </tbody>
		    </table>
		</div>
	</div>		  

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.jsscript"></script>
</body>
</html>
