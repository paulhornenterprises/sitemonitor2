<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: commonHead('Site Maintenance', ~{})}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/sites"> Site Monitor </a>
      </div>
    </nav>
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card dashboard-card">
            <div class="card-header bg-white">
              <h3 class="page-header mb-0">Site Maintenance</h3>
            </div>

            <div class="card-body">
              <form th:object="${site}" th:action="@{/sites}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{failures}" />
                <input type="hidden" th:field="*{lastNotification}" />
                <input type="hidden" th:field="*{lastChecked}" />
                <input type="hidden" th:field="*{eventTime}" />
                <input type="hidden" th:field="*{eventDescription}" />
                <input type="hidden" th:field="*{eventChange}" />

                <div class="mb-3">
                  <label for="status" class="form-label">Current Status</label>
                  <input id="status"
                    type="text"
                    class="form-control"
                    th:value="${site.status}"
                    readonly />
                  <div class="form-text">Updated automatically by the monitoring service.</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input type="text" class="form-control" th:field="*{name}" />
                </div>

                <div class="mb-3">
                  <label class="form-label">URL</label>
                  <input type="url" class="form-control" th:field="*{url}" />
                </div>

                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" th:field="*{enabled}" />
                  <label class="form-check-label"> Enabled </label>
                </div>

                <div class="mb-3">
                  <label class="form-label">Failure Limit</label>
                  <input type="number" class="form-control" th:field="*{failureLimit}" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Assert Text</label>
                  <input type="text" class="form-control" th:field="*{assertText}" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Notify (comma separated)</label>
                  <input type="text" class="form-control" th:field="*{notify}" />
                </div>

                <div class="mt-4">
                  <button type="submit" class="btn btn-primary">Save Changes</button>

                  <a th:href="@{/sites}" class="btn btn-outline-secondary"> Cancel </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
